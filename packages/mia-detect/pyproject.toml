[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mia-detect"
version = "0.1.0"
description = "Standalone, clean-room detection research toolkit"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
dependencies = []

[project.scripts]
mia-detect = "mia_detect.similarity.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
